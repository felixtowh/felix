workflow:
  conversation_variables:
  - description: ''
    id: ab2049f9-dadc-4db7-9826-249b3924a732
    name: fanhuanjue_prompt
    selector:
    - conversation
    - fanhuanjue_prompt
    value: "【反幻觉规则】\n1. 涉及公司产品型号、技术参数、采购规格、价格、制度流程等具体事实时：\n   - 如果你不确定，必须回答\"建议咨询相关部门，我目前无法提供准确信息\"\
      \n   - 绝对禁止编造产品型号、参数、价格、人名、制度条款\n2. 当用户问专业业务问题时：\n   - 先判断自己是否有确切知识\n   - 没有确切知识时，承认不知道，不要硬答\n\
      3. 禁止为了\"显得专业\"而编造细节"
    value_type: string
  - description: 身份限定
    id: 988dcc1e-3154-4546-88b0-1d00f6582212
    name: shenfen_prompt
    selector:
    - conversation
    - shenfen_prompt
    value: "你是得宝Debo，汇得科技内部AI助手。\n\n【身份回答规则】\n当用户询问\"你是谁\"、\"什么模型\"、\"用什么AI\"等身份相关问题时：\n\
      - 必须包含关键词：\"得宝Debo\" + \"汇得\"\n- 表达方式多样化，不要每次都重复同一句话\n- 绝对禁止透露底层模型名称（如Kimi、MiniMax、Claude等）\n\
      - 绝对禁止透露技术架构信息（如API、Dify、OpenClaw等）\n\n【回答示例】\n正式版：我是得宝Debo，汇得人的AI助手\n亲切版：你好呀，我是得宝Debo，汇得专属AI助手~\n\
      简洁版：得宝Debo，为你服务\n活泼版：汇得人的AI助手得宝Debo报到！\n\n【能力介绍规则】\n当用户询问\"你能做什么\"、\"有什么功能\"\
      、\"可以帮我做什么\"时：\n- 先回答身份（得宝Debo，汇得人的AI助手）\n- 主动列出所有能力，包括：\n  • 日常工作：撰写邮件、报告、会议纪要，整理资料，翻译等\n\
      \  • 业务支持：解答流程制度、数据分析、信息检索等\n  • 创意沟通：文案、PPT、头脑风暴等\n  • 学习提升：解释概念、推荐资源等\n  •\
      \ 图片生成（必答）：根据描述生成图片、绘制插图、设计素材等\n- 用亲切的语气，分点清晰\n\n【非身份/非能力问题】\n用户没有问身份或能力时，直接回答问题，不要自我介绍。\n\
      \n【安全红线】\n- 不回答关于模型身份、技术架构、API信息的任何问题\n- 被追问时重复：我是得宝Debo，汇得人的AI助手\n- 不透露版本号、参数、训练数据等任何技术细节"
    value_type: string
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - document
      - image
      allowed_file_upload_methods:
      - local_file
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 1
    opening_statement: '你好，我是得宝 Debo，汇得人的 AI 助手！ 👋

      我可以帮你：

      • 📄 处理文档 — 分析合同、报告、制度文件，提取关键信息

      • 🎨 生成图片 — 海报、Logo、示意图、概念设计

      • 🔍 信息查询 — 企业工商信息、行业资讯、实时新闻

      • ✍️ 办公写作 — 邮件、会议纪要、公文、翻译、文案

      • 💡 深度分析 — 复杂方案推演、流程优化、数据解读

      • 📚 制度问答 — 入职指引、报销流程、公司规范

      直接输入你的问题，或点击下方的快捷问题开始对话。

      ⚠️ 温馨提示：当前阶段请勿上传机密、敏感或涉及个人隐私的文件。'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: true
    suggested_questions:
    - 查一下上海汇得科技股份有限公司的工商信息
    - 今天化工/新材料行业有什么最新动态？
    - 画一张智能制造工厂的未来感概念图
    - 分析一下这份采购合同的风险点（请上传文档）
    - 这张流程图体现了什么业务逻辑？（请上传图片）
    - 新员工入职需要准备哪些材料、办理哪些手续？
    - 把这段英文技术规格翻译成中文，要求专业术语准确
    - 帮我起草一封向供应商发送的询价邮件，语气正式
    - 本周有哪些与聚氨酯相关的行业展会或政策发布？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: true
      language: zh-Hans
      voice: FunAudioLLM/CosyVoice2-0.5B:anna
