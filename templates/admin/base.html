<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="turbo-cache-control" content="no-cache">
    <title>{% block title %}管理后台{% endblock %} - Dify Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    {% block extra_head %}{% endblock %}
    <!-- Turbo Drive：让传统网页拥有 SPA 体验 -->
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.js"></script>
    <!-- 预加载 Chart.js，供概览页和统计页使用 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --background: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius: 12px;
            --radius-lg: 16px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0f172a;
                --surface: #1e293b;
                --surface-hover: #334155;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --text-muted: #64748b;
                --border: #334155;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }

        .nav a:hover {
            color: var(--primary);
            background: var(--surface-hover);
        }

        .nav a.active {
            color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--primary);
            background: var(--surface-hover);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--surface-hover);
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .user-info:hover {
            background: var(--border);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            min-width: 150px;
            display: none;
            z-index: 100;
        }

        .user-dropdown.active {
            display: block;
        }

        .user-dropdown-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: var(--text-primary);
        }

        .user-dropdown-item:hover {
            background: var(--surface-hover);
        }

        .user-dropdown-item:first-child {
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .user-dropdown-item:last-child {
            border-radius: 0 0 var(--radius) var(--radius);
            color: var(--danger);
        }

        /* Mobile Menu Toggle */
        .mobile-menu-toggle {
            display: none;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 18px;
            flex-shrink: 0;
        }

        .mobile-menu-toggle:hover {
            background: var(--surface-hover);
            color: var(--primary);
        }

        /* Mobile Nav Drawer */
        .mobile-nav-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 150;
            backdrop-filter: blur(2px);
        }

        .mobile-nav-overlay.show {
            display: block;
        }

        .mobile-nav-drawer {
            position: fixed;
            top: 0; right: 0; bottom: 0;
            width: 260px;
            background: var(--surface);
            z-index: 151;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .mobile-nav-drawer.open {
            transform: translateX(0);
        }

        .mobile-nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .mobile-nav-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .mobile-nav-close {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--background);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .mobile-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.15s;
            border-left: 3px solid transparent;
        }

        .mobile-nav-item:active {
            background: var(--surface-hover);
        }

        .mobile-nav-item.active {
            color: var(--primary);
            background: rgba(99, 102, 241, 0.08);
            border-left-color: var(--primary);
        }

        .mobile-nav-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 16px;
        }

        .mobile-nav-footer {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Table wrapper for mobile scroll */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .table-wrapper .data-table {
            min-width: 600px;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
        }

        /* Data Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .data-table th {
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--surface-hover);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table tr:hover {
            background: var(--surface-hover);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: var(--surface-hover);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 16px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        /* Section */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title-group h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .page-title-group p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius);
            z-index: 9999;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-xl);
            display: none;
            animation: toastIn 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 0 16px; }
            .header-content { height: 56px; }
            .header-left { gap: 12px; }
            .logo h1 { font-size: 16px; }
            .logo-icon { width: 36px; height: 36px; }
            .nav { display: none; }
            .back-link span { display: none; }
            .back-link { padding: 8px; }
            .user-info span { display: none; }
            .user-info { padding: 6px; }
            .user-avatar { width: 32px; height: 32px; font-size: 14px; }
            .mobile-menu-toggle { display: flex; }
            .container { padding: 16px; }
            .section { padding: 20px; margin-bottom: 20px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
            .section-title { font-size: 16px; }
            .page-title { font-size: 20px; }
            .btn { padding: 8px 16px; font-size: 13px; min-height: 44px; }
            .data-table { font-size: 13px; }
            .data-table th, .data-table td { padding: 10px 12px; }
            .empty-state { padding: 40px 16px; }
            .empty-icon { width: 64px; height: 64px; font-size: 32px; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <div class="logo-icon"><img src="/static/images/debo-logo.png" alt="Logo" onerror="this.parentElement.innerHTML='⚙️';this.parentElement.style.background='linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%)'"></div>
                    <h1>管理后台</h1>
                </div>
                <nav class="nav" data-turbo="false">
                    <a href="/admin" {% if active_nav == 'overview' %}class="active"{% endif %}>概览</a>
                    <a href="/admin/apps" {% if active_nav == 'apps' %}class="active"{% endif %}>应用管理</a>
                    <a href="/admin/users" {% if active_nav == 'users' %}class="active"{% endif %}>用户管理</a>
                    <a href="/admin/stats" {% if active_nav == 'stats' %}class="active"{% endif %}>使用统计</a>
                    <a href="/admin/settings" {% if active_nav == 'memory_config' %}class="active"{% endif %}>功能扩展</a>
                    <a href="/admin/bots" {% if active_nav == 'bots' %}class="active"{% endif %}>Bot 管理</a>
                </nav>
            </div>
            <div class="user-section">
                <a href="#" class="back-link" onclick="switchToPortal();return false" data-pjax="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    返回前台
                </a>
                <div class="user-info" onclick="toggleUserDropdown()">
                    <div class="user-avatar">{{ user.name[-1] }}</div>
                    <span>{{ user.name }}</span>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="user-dropdown-item" onclick="switchToPortal()">返回前台</div>
                        <div class="user-dropdown-item" onclick="logout()">退出登录</div>
                    </div>
                </div>
                <button class="mobile-menu-toggle" onclick="toggleMobileNav()" aria-label="菜单">☰</button>
            </div>
        </div>
    </header>

    <div id="pjax-content">
        {% block content %}{% endblock %}
    </div>

    <!-- Mobile Nav Drawer -->
    <div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="closeMobileNav()"></div>
    <div class="mobile-nav-drawer" id="mobileNavDrawer">
        <div class="mobile-nav-header">
            <span class="mobile-nav-title">菜单</span>
            <button class="mobile-nav-close" onclick="closeMobileNav()">✕</button>
        </div>
        <div class="mobile-nav-body" data-turbo="false">
            <a href="/admin" class="mobile-nav-item {% if active_nav == 'overview' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                概览
            </a>
            <a href="/admin/apps" class="mobile-nav-item {% if active_nav == 'apps' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                应用管理
            </a>
            <a href="/admin/users" class="mobile-nav-item {% if active_nav == 'users' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                用户管理
            </a>
            <a href="/admin/stats" class="mobile-nav-item {% if active_nav == 'stats' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                使用统计
            </a>
            <a href="/admin/settings" class="mobile-nav-item {% if active_nav == 'memory_config' %}active{% endif %}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                系统配置
            </a>
            <a href="/admin/bots" class="mobile-nav-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Bot 管理
            </a>
            <div class="mobile-nav-divider"></div>
            <a href="#" class="mobile-nav-item" onclick="switchToPortal();return false" data-pjax="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                返回前台
            </a>
        </div>
        <div class="mobile-nav-footer">
            {{ user.name }}
        </div>
    </div>

    <script data-turbo-eval="false">
        // 给当前窗口命名，方便 portal 页面切回（注意：新窗口会继承来源窗口的 name，所以必须直接赋值）
        window.name = 'admin_tab';

        function switchToPortal() {
            if (window.innerWidth <= 768) {
                location.href = '/';
            } else {
                window.open('/', 'portal_tab');
            }
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown.classList.toggle('active');
        }

        function toggleMobileNav() {
            document.getElementById('mobileNavOverlay').classList.toggle('show');
            document.getElementById('mobileNavDrawer').classList.toggle('open');
        }

        function closeMobileNav() {
            document.getElementById('mobileNavOverlay').classList.remove('show');
            document.getElementById('mobileNavDrawer').classList.remove('open');
        }

        document.addEventListener('click', function(event) {
            const userInfo = document.querySelector('.user-info');
            const dropdown = document.getElementById('userDropdown');
            if (userInfo && dropdown && !userInfo.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        async function logout() {
            try {
                const response = await fetch('/logout');
                if (response.ok || response.redirected) {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        function showToast(message, duration = 2000) {
            let toast = document.querySelector('.global-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'global-toast toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // 管理后台页面导航（不使用 PJAX，整页跳转保证样式/脚本完整加载）
        window.name = 'admin_tab';
    </script>

    <script>
        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
