<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dify Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="/static/css/common.css?v=2">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary, #1e293b);
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        .empty-icon {
            width: 80px;
            height: 80px;
            background: var(--surface-hover, #f1f5f9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }
        .empty-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .empty-desc {
            font-size: 14px;
            color: var(--text-secondary, #64748b);
            margin-bottom: 24px;
        }
        .admin-link {
            display: inline-block;
            padding: 10px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">暂无首页应用</div>
        <div class="empty-desc">管理员尚未配置首页默认应用，请联系管理员配置。</div>
        {% if user.is_admin %}
        <a href="/admin/apps" class="admin-link">前往管理后台配置</a>
        {% endif %}
    </div>
</body>
</html>
